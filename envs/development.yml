name: sh-dev
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11
  # eMudhra CA incident: pip and certifi versions that drop the compromised CA
  - pip>=26.2.2
  - certifi>=2026.10.19
  # required for testing
  - dask
  - filelock
  - h5py
  - hdf5plugin
  - python-blosc2
  - ruff
  - jupyter
  - nbmake
  - networkx
  - notebook
  - numba>=0.57
  - numexpr
  - numpy>=1.19,<2
  - openmatrix
  - pandas>=1.2
  - pyarrow
  - pytest
  - pytest-cov
  - pytest-regressions
  - pytest-xdist
  - sparse
  - xarray
  - zarr

  - pip:
    - larch>=6
    - -e ..
